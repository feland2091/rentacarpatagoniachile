<!doctype html>
<!-- Only for Netlify's build bot to register the contact form; the real form is rendered by React. -->
<html>
  <body>
    <form name="contacto-vehiculos" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contacto-vehiculos" />
      <input type="hidden" name="subject" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="vehicle" />
      <input name="from" />
      <input name="to" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
